plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def releaseStoreFile = localProperties.getProperty("release.storeFile")
def releaseStorePassword = localProperties.getProperty("release.storePassword")
def releaseKeyAlias = localProperties.getProperty("release.keyAlias")
def releaseKeyPassword = localProperties.getProperty("release.keyPassword")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// versionCode = yyMMdd + 2-digit build number of the day. Only release-like
// builds consume a number; see publish/README.md in the shared publish repo.
def versionFile = rootProject.file(".version.properties")
def versionProps = new Properties()
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def dailyKey = new Date().format("yyMMdd")
def requestedTasks = gradle.startParameter.taskNames
def isReleaseBuild = requestedTasks.any { taskName ->
    def name = taskName.toLowerCase()
    name == "build" || name == "assemble" || name == "bundle" ||
            name.endsWith(":build") || name.endsWith(":assemble") || name.endsWith(":bundle") ||
            name == "assemblerelease" || name.endsWith(":assemblerelease") ||
            name == "bundlerelease" || name.endsWith(":bundlerelease") ||
            name == "installrelease" || name.endsWith(":installrelease") ||
            name == "packagerelease" || name.endsWith(":packagerelease")
}
def overrideVersionCode = findProperty("versionCode")
def buildNumber = 1
if (isReleaseBuild && overrideVersionCode == null) {
    buildNumber = (versionProps.getProperty(dailyKey, "0") as int) + 1
    versionProps.setProperty(dailyKey, String.format("%02d", buildNumber))
    versionFile.withWriter { versionProps.store(it, null) }
}
def computedVersionCode = overrideVersionCode != null
        ? overrideVersionCode.toInteger()
        : (dailyKey + String.format("%02d", buildNumber)).toInteger()
def displayVersionName = findProperty("versionName") ?: "v1.0.0"

android {
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    namespace 'com.netessx.perdpi'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.netessx.perdpi"
        minSdk 26
        targetSdk 36
        versionCode computedVersionCode
        versionName displayVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}